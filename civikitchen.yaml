$schema: https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
policy:
  # Expected values for ckconform (the checker lives in the public civikitchen
  # image; these values are ours).
  license: AGPL-3.0-or-later
  copyright: 'civico GmbH'

  # Floor = measured value (ckcoverage, 94 %) minus one; uncovered are the
  # listener's catch branch and non-scalar param fallbacks. Raise, never lower.
  coverage:
    minimum: 93

  # The one business hook (postEmailSend) is a scan class; mailtrail.php
  # carries only the civix lifecycle delegates.
  hook_style: listener
  renovate_preset: github>civico-de/renovate

  untagged_versions:
    - version: "0.1.0"
      reason: shipped to an instance from the checkout before the release workflow existed; first release is 0.1.1
